services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: currency-analyst-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    volumes:
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: currency-analyst-ui
    command:
      [
        "uv",
        "run",
        "streamlit",
        "run",
        "frontend/app.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
        "--browser.gatherUsageStats",
        "false",
      ]
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      CURRENCY_API_URL: http://api:8000/currency/analyze
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped