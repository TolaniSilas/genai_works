[project]
name = "currency-analyst-agent"
version = "0.1.0"
description = "CrewAI-powered real-time currency analysis with FastAPI and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai[tools]>=1.7.2",
    "fastapi>=0.128.0",
    "streamlit>=1.52.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
